<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Brief - Meeting Memory AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        nav {
            height: 68px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
        }

        .logo {
            font-size: 19px;
            font-weight: 700;
        }

        nav a {
            text-decoration: none;
            color: #6b7280;
            font-size: 14px;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 50px 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
        }

        .name {
            font-size: 23px;
            font-weight: 700;
        }

        .details {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .meeting-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 22px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
        }

        .purpose {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            margin: 28px 0 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .goal {
            background: #111827;
            color: white;
            padding: 22px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .memory {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
        }

        .memory h3 {
            margin: 0 0 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .memory p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: #374151;
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background: #111827;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .button:hover {
            background: #1f2937;
        }

        @media (max-width: 650px) {

            nav {
                padding: 0 20px;
            }

            main {
                padding: 35px 18px;
            }

            .meeting-info,
            .memory-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        Meeting Memory AI
    </div>

    <a href="./index.html">
        ← Edit meeting
    </a>

</nav>



<main>

    <h1>
        Your meeting brief
    </h1>

    <p class="subtitle">
        Here's your personalized meeting preparation.
    </p>



    <!-- =========================================
         BASIC MEETING INFORMATION
    ========================================== -->

    <div class="card">

        <div class="name" id="personName"></div>

        <div class="details" id="personDetails"></div>


        <div class="meeting-info">

            <div class="info-box">

                <div class="info-label">
                    Meeting date
                </div>

                <div
                    class="info-value"
                    id="meetingDate">
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Meeting time
                </div>

                <div
                    class="info-value"
                    id="meetingTime">
                </div>

            </div>

        </div>


        <div
            class="purpose"
            id="purpose">
        </div>

    </div>



    <!-- =========================================
         MEETING GOAL
    ========================================== -->

    <div class="section-title">
        Your meeting goal
    </div>

    <div
        class="goal"
        id="goal">
    </div>



    <!-- =========================================
         HINDSIGHT MEMORIES
    ========================================== -->

    <div class="section-title">
        What I remember
    </div>


    <div
        class="memory-grid"
        id="memoryGrid">
    </div>



    <!-- =========================================
         AI GENERATED MEETING PREPARATION
    ========================================== -->

    <div class="section-title">
        Suggested talking points
    </div>


    <div
        class="card"
        id="aiBriefCard">

        <div id="aiBrief">
            Loading AI preparation...
        </div>

    </div>



    <!-- =========================================
         COMPLETE MEETING
    ========================================== -->

    <a
        href="./dashboard.html"
        class="button">

        Meeting completed →

    </a>


</main>



<script>


/* ============================================================
   CHECK LOGIN
============================================================ */

const userEmail =
    localStorage.getItem("userEmail");


if (!userEmail) {

    alert(
        "Please login before viewing a meeting."
    );

    window.location.replace(
        "login.html"
    );

}



/* ============================================================
   GET MEETING ID FROM URL
============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );


const meetingId =
    params.get("meeting_id");



/* ============================================================
   LOAD MEETING
============================================================ */

async function loadMeeting() {


    /* --------------------------------------------------------
       CHECK WHETHER MEETING ID EXISTS
    -------------------------------------------------------- */

    if (!meetingId) {

        document.getElementById(
            "personName"
        ).textContent =
            "No meeting selected";

        return;

    }



    try {


        /* ----------------------------------------------------
           GET MEETING FROM FLASK
        ---------------------------------------------------- */

        const response =
    await fetch(
        "/api/meetings/"
        + encodeURIComponent(meetingId)
        + "?user_email="
        + encodeURIComponent(userEmail)
    );



        /* ----------------------------------------------------
           CHECK RESPONSE
        ---------------------------------------------------- */

        if (!response.ok) {

            throw new Error(
                "Meeting not found"
            );

        }



        /* ----------------------------------------------------
           CONVERT RESPONSE TO JSON
        ---------------------------------------------------- */

        const data =
            await response.json();



        /* ----------------------------------------------------
           CHECK SUCCESS
        ---------------------------------------------------- */

        if (!data.success) {

            throw new Error(
                data.error ||
                "Could not load meeting"
            );

        }



        /* ----------------------------------------------------
           GET MEETING OBJECT
        ---------------------------------------------------- */

        const meeting =
            data.meeting;



        /* ====================================================
           BASIC MEETING INFORMATION
        ==================================================== */

        document.getElementById(
            "personName"
        ).textContent =
            meeting.person_name || "";



        document.getElementById(
            "personDetails"
        ).textContent =
            (meeting.company || "") +
            " · " +
            (meeting.role || "");



        /* ====================================================
           MEETING DATE
        ==================================================== */

        document.getElementById(
            "meetingDate"
        ).textContent =
            formatDate(
                meeting.meeting_date
            );



        /* ====================================================
           MEETING TIME
        ==================================================== */

        document.getElementById(
            "meetingTime"
        ).textContent =
            formatTime(
                meeting.meeting_time
            );



        /* ====================================================
           PURPOSE
        ==================================================== */

        document.getElementById(
            "purpose"
        ).textContent =
            meeting.purpose || "";



        /* ====================================================
           MEETING GOAL
        ==================================================== */

        document.getElementById(
            "goal"
        ).textContent =
            meeting.meeting_goal ||
            meeting.goal ||
            meeting.purpose ||
            "";



        /* ====================================================
           DISPLAY AI GENERATED BRIEF
        ==================================================== */

        displayAIBrief(
            meeting.brief || ""
        );



        /* ====================================================
           DISPLAY HINDSIGHT MEMORIES
        ==================================================== */

        displayMemories(
            data.memories || []
        );


    }


    catch (error) {


        console.error(
            "Error loading meeting:",
            error
        );


        document.getElementById(
            "personName"
        ).textContent =
            "Could not load meeting";


        document.getElementById(
            "personDetails"
        ).textContent =
            error.message ||
            "Something went wrong";


    }

}



/* ============================================================
   DISPLAY HINDSIGHT MEMORIES
============================================================ */

function displayMemories(memories) {


    const memoryGrid =
        document.getElementById(
            "memoryGrid"
        );


    if (!memoryGrid) {

        return;

    }



    memoryGrid.innerHTML = "";



    if (
        !memories ||
        memories.length === 0
    ) {

        memoryGrid.innerHTML = `

            <div class="memory">

                <h3>
                    No previous memories
                </h3>

                <p>
                    No previous information was found
                    for this contact.
                </p>

            </div>

        `;


        return;

    }



    memories.forEach(
        function(memory) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "memory";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                memory.type ||
                "Memory";


            const text =
                document.createElement(
                    "p"
                );


            text.textContent =
                memory.text ||
                "";


            card.appendChild(
                title
            );


            card.appendChild(
                text
            );


            memoryGrid.appendChild(
                card
            );


        }
    );

}



/* ============================================================
   DISPLAY AI BRIEF
============================================================ */

function displayAIBrief(brief) {


    const sectionTitles =
        document.querySelectorAll(
            ".section-title"
        );


    let targetSection =
        null;


    sectionTitles.forEach(
        function(section) {

            if (
                section.textContent.trim()
                ===
                "Suggested talking points"
            ) {

                targetSection =
                    section;

            }

        }
    );


    if (!targetSection) {

        return;

    }


    const aiCard =
        targetSection.nextElementSibling;


    if (!aiCard) {

        return;

    }


    aiCard.innerHTML = "";


    const pre =
        document.createElement(
            "div"
        );


    pre.style.whiteSpace =
        "pre-wrap";


    pre.style.lineHeight =
        "1.7";


    pre.style.fontSize =
        "14px";


    pre.textContent =
        brief ||
        "No AI preparation available.";


    aiCard.appendChild(
        pre
    );

}



/* ============================================================
   FORMAT DATE
============================================================ */

function formatDate(value) {


    if (!value) {

        return "Not available";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}



/* ============================================================
   FORMAT TIME
============================================================ */

function formatTime(value) {


    if (!value) {

        return "Not available";

    }


    /*
       HTML time input normally gives:

       10:30
    */

    if (
        /^\d{2}:\d{2}$/.test(value)
    ) {

        const parts =
            value.split(":");


        let hours =
            parseInt(
                parts[0],
                10
            );


        const minutes =
            parts[1];


        const ampm =
            hours >= 12
                ? "PM"
                : "AM";


        hours =
            hours % 12 ||
            12;


        return (
            hours +
            ":" +
            minutes +
            " " +
            ampm
        );

    }



    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}



/* ============================================================
   START
============================================================ */

if (userEmail) {
    loadMeeting();
}

</script>


</body>
</html>
