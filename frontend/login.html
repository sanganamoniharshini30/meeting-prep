<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Meeting Memory AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 35px;
            color: #111827;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        button:hover {
            background: #1f2937;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 13px;
        }

        .bottom-text a {
            color: #111827;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="logo">
                Meeting Memory AI
            </div>

            <h1>Welcome back</h1>

            <p class="subtitle">
                Sign in to continue to your meeting memory.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Continue
                </button>

            </form>


            <div class="bottom-text">

                New here?

                <a href="signup.html">
                    Create an account
                </a>

            </div>

        </div>

    </div>


    <script>

    document.getElementById("loginForm").onsubmit = function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        if (!email) {
            alert("Please enter your email.");
            return;
        }

        // Store the logged-in user's email
        localStorage.setItem(
            "userEmail",
            email
        );

        // Store the user's display name
        localStorage.setItem(
            "userName",
            email.split("@")[0]
        );

        // Open this user's dashboard
        window.location.replace("dashboard.html");

    };

</script>

</body>

</html>
